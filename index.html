<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Chat Dimension: Robot Raiders</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#050817;color:#eaf7ff;font-family:system-ui}canvas{display:block}#hud{position:fixed;inset:0;pointer-events:none}.panel{position:absolute;background:#071426d9;border:1px solid #55d9ff77;border-radius:12px;padding:9px 12px;backdrop-filter:blur(8px);box-shadow:0 0 18px #00bfff22}#title{top:10px;left:10px;font-weight:900;letter-spacing:1px;color:#9cecff}#stats{top:52px;left:10px;font-size:12px;line-height:1.6}#help{top:10px;right:10px;max-width:245px;font-size:11px;text-align:right}#cross{position:absolute;left:50%;top:50%;width:12px;height:12px;transform:translate(-50%,-50%);border:1px solid white;border-radius:50%}#message{position:absolute;top:42%;left:50%;transform:translate(-50%,-50%);font-size:clamp(18px,3vw,28px);font-weight:900;text-align:center;text-shadow:0 2px 12px #000;opacity:0;transition:opacity .2s}#controls{position:absolute;inset:auto 0 14px;display:flex;justify-content:space-between;padding:0 14px}.pad,.actions{display:grid;gap:7px}.pad{grid-template-columns:repeat(3,48px);grid-template-rows:repeat(2,45px)}.actions{grid-template-columns:repeat(2,60px)}button{border:1px solid #8beaff99;background:#071b31dd;color:white;border-radius:13px;font-size:17px;font-weight:800;touch-action:none}.empty{visibility:hidden}.wide{font-size:11px}@media(min-width:850px){#controls{opacity:.65}}
</style></head><body><div id="hud"><div id="title" class="panel">CHAT DIMENSION <span style="color:#ffcb65">/ ROBOT RAIDERS</span></div><div id="stats" class="panel">HEALTH <b id="health">100</b>%<br>ROBOTS DISABLED <b id="score">0</b><br>ISLAND <b id="island">CENTRAL HUB</b></div><div id="help" class="panel">WASD / arrows: move · mouse: look<br>SPACE: jump · click / F: pulse<br>Mobile: use the buttons below</div><div id="cross"></div><div id="message"></div><div id="controls"><div class="pad"><button class="empty"></button><button data-key="KeyW">▲</button><button class="empty"></button><button data-key="KeyA">◀</button><button data-key="KeyS">▼</button><button data-key="KeyD">▶</button></div><div class="actions"><button class="wide" data-key="ArrowLeft">TURN ◀</button><button class="wide" data-key="ArrowRight">TURN ▶</button><button class="wide" id="jump">JUMP</button><button class="wide" id="fire">PULSE</button></div></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x050817);scene.fog=new THREE.FogExp2(0x050817,.004);
const camera=new THREE.PerspectiveCamera(76,innerWidth/innerHeight,.1,500);camera.rotation.order='YXZ';
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.2;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0x9ddcff,0x151126,2));const sun=new THREE.DirectionalLight(0xffffff,2.2);sun.position.set(-35,65,25);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun);
const starGeo=new THREE.BufferGeometry(),pts=[];for(let i=0;i<1300;i++)pts.push((Math.random()-.5)*260,Math.random()*130-5,(Math.random()-.5)*260);starGeo.setAttribute('position',new THREE.Float32BufferAttribute(pts,3));scene.add(new THREE.Points(starGeo,new THREE.PointsMaterial({color:0xb8eaff,size:.32})));
const material=(c,r=.7,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m}),stone=material(0x29394c),trim=material(0x17283d,.4,.55),beam=new THREE.MeshBasicMaterial({color:0x58e8ff});
const islands=[],platforms=[],robots=[],shots=[],keys={};let health=100,score=0,yaw=0,pitch=0,vy=0,grounded=false,cool=0,msgTime=0;
const player={x:0,y:2,z:0};
function meshBox(parent,x,y,z,w,h,d,mat,solid=false){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);if(solid)platforms.push({x,y:y+h/2,z,w,h,d});return o}
function cyl(parent,x,y,z,rt,rb,h,mat,n=9){const o=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,n),mat);o.position.set(x,y,z);o.castShadow=true;parent.add(o);return o}
function island(name,color,x,z,size){const g=new THREE.Group();g.position.set(x,0,z);scene.add(g);const top=new THREE.Mesh(new THREE.CylinderGeometry(size*.88,size,1.7,10),material(color));top.position.y=-.85;top.receiveShadow=true;top.castShadow=true;g.add(top);cyl(g,0,-2,0,size*.55,size*.85,1.4,stone,8);const rim=new THREE.Mesh(new THREE.TorusGeometry(size*.83,.09,6,48),new THREE.MeshBasicMaterial({color}));rim.rotation.x=Math.PI/2;g.add(rim);islands.push({name,x,z,size});return g}
const hub=island('CENTRAL HUB',0x29445f,0,0,10);cyl(hub,0,2,0,2.6,3.3,4,material(0x182b43,.4,.6),12);for(let i=0;i<8;i++){const a=i*Math.PI/4;meshBox(hub,Math.cos(a)*2.4,2.3,Math.sin(a)*2.4,.14,3,.14,beam)}
const themes=[['GAMER',0xe33b45],['SLEEP',0xff9638],['SCIENCE',0xf0d52e],['MINECRAFT',0x3caf61],['FUTURE',0x31d8e9],['CHILL',0x9360e9],['ART',0xf17bd0],['PAST',0x9a6742],['STORY',0xe8edf2],['MYSTERY',0x262b3b],['MATH',0x8794a5],['SPACE',0x3f73cf],['SECRET',0xc4cbd5],['PRESENT',0xb47b4c],['FOOD',0x69c58a]];
themes.forEach(([name,color],i)=>{const a=i*Math.PI*2/themes.length,r=29+(i%3)*2,x=Math.cos(a)*r,z=Math.sin(a)*r,g=island(name,color,x,z,7.2),house=new THREE.Group();g.add(house);meshBox(house,0,1.55,-2.15,4.5,3.1,.28,material(color),true);meshBox(house,-2.1,1.55,0,.28,3.1,4.5,material(color),true);meshBox(house,2.1,1.55,0,.28,3.1,4.5,material(color),true);meshBox(house,-1.3,1.55,2.15,1.9,3.1,.28,material(color),true);meshBox(house,1.3,1.55,2.15,1.9,3.1,.28,material(color),true);meshBox(house,0,3.18,0,4.7,.25,4.8,trim);const roof=new THREE.Mesh(new THREE.ConeGeometry(3.5,1.5,4),trim);roof.position.y=4;roof.rotation.y=Math.PI/4;house.add(roof);for(const s of [-1,1])meshBox(house,s*2.26,1.9,-.6,.07,1.05,1.05,beam);meshBox(house,0,.05,0,4.05,.12,4.05,trim);meshBox(house,-1,.55,-.7,.8,.9,.65,trim);meshBox(house,1,.45,-.8,1.1,.7,.6,trim);const lamp=new THREE.PointLight(color,1.5,9);lamp.position.set(0,2.6,0);house.add(lamp);
for(let p=0;p<6;p++){const t=.22+p*.13,px=x*t,pz=z*t,py=.28+Math.sin(p*1.4)*.35;const plat=meshBox(scene,px,py,pz,2.5,.42,2.5,material(0x354c62,.5,.4),true);plat.rotation.y=Math.atan2(x,z)}
cyl(g,0,.5,-4.3,.16,.22,1.3,beam,8);
});
function makeRobot(x,z){const g=new THREE.Group();scene.add(g);const metal=material(0x778b9b,.35,.75),red=material(0xff4e5d,.3,.3);meshBox(g,0,.9,0,.85,1,.55,metal);meshBox(g,0,1.62,0,.68,.52,.62,metal);meshBox(g,0,1.65,.34,.38,.12,.08,red);for(const s of [-1,1]){meshBox(g,s*.25,.22,0,.2,.55,.22,metal);meshBox(g,s*.58,.95,0,.22,.7,.22,metal)}robots.push({g,x,z,phase:Math.random()*6})}
themes.forEach((t,i)=>{const a=i*Math.PI*2/themes.length,r=29+(i%3)*2;for(let j=0;j<2;j++)makeRobot(Math.cos(a)*r+(Math.random()-.5)*5,Math.sin(a)*r+(Math.random()-.5)*5)});for(let i=0;i<5;i++)makeRobot((Math.random()-.5)*10,(Math.random()-.5)*10);
function say(t){const e=document.getElementById('message');e.textContent=t;e.style.opacity=1;msgTime=2}
function jump(){if(grounded){vy=8.2;grounded=false}}
function fire(){if(cool>0)return;cool=.3;const dir=new THREE.Vector3(0,0,-1).applyEuler(camera.rotation),o=new THREE.Mesh(new THREE.SphereGeometry(.13,10,8),new THREE.MeshBasicMaterial({color:0x68efff}));o.position.copy(camera.position).addScaledVector(dir,.8);scene.add(o);shots.push({o,dir,life:1.3})}
document.getElementById('jump').onpointerdown=e=>{e.preventDefault();jump()};document.getElementById('fire').onpointerdown=e=>{e.preventDefault();fire()};
document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;b.onpointerdown=e=>{e.preventDefault();keys[k]=true;b.setPointerCapture(e.pointerId)};['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false))});
addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space'){e.preventDefault();jump()}if(e.code==='KeyF')fire()});addEventListener('keyup',e=>keys[e.code]=false);
let drag=false,lx=0,ly=0;renderer.domElement.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'){renderer.domElement.requestPointerLock?.()}else{drag=true;lx=e.clientX;ly=e.clientY}});addEventListener('pointerup',()=>drag=false);addEventListener('mousemove',e=>{if(document.pointerLockElement===renderer.domElement){yaw-=e.movementX*.0022;pitch=Math.max(-1.2,Math.min(1.2,pitch-e.movementY*.0022))}});renderer.domElement.addEventListener('pointermove',e=>{if(drag){yaw-=(e.clientX-lx)*.006;pitch=Math.max(-1.1,Math.min(1.1,pitch-(e.clientY-ly)*.004));lx=e.clientX;ly=e.clientY}});renderer.domElement.addEventListener('click',()=>{if(matchMedia('(pointer:fine)').matches)fire()});
function groundAt(x,z){let y=-100;for(const a of islands)if(Math.hypot(x-a.x,z-a.z)<a.size*.86)y=Math.max(y,0);for(const p of platforms)if(Math.abs(x-p.x)<p.w/2+.22&&Math.abs(z-p.z)<p.d/2+.22&&player.y>=p.y-.2)y=Math.max(y,p.y);return y}
function blocked(x,z){for(const p of platforms)if(p.h>1&&Math.abs(x-p.x)<p.w/2+.32&&Math.abs(z-p.z)<p.d/2+.32&&player.y<p.y+p.h/2+.3&&player.y>p.y-p.h/2-.5)return true;return false}
function update(dt){const f=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0),s=(keys.KeyD?1:0)-(keys.KeyA?1:0);if(keys.ArrowLeft)yaw+=dt*1.8;if(keys.ArrowRight)yaw-=dt*1.8;const dx=(-Math.sin(yaw)*f+Math.cos(yaw)*s)*8*dt,dz=(-Math.cos(yaw)*f-Math.sin(yaw)*s)*8*dt;if(!blocked(player.x+dx,player.z))player.x+=dx;if(!blocked(player.x,player.z+dz))player.z+=dz;vy-=19*dt;player.y+=vy*dt;const gy=groundAt(player.x,player.z);if(player.y<=gy&&vy<0){player.y=gy;vy=0;grounded=true}else grounded=false;if(player.y<-18){health=Math.max(health-10,0);player.x=0;player.z=0;player.y=2;vy=0;say('FALL RESET! Returned to the central hub');if(health===0)health=100}
camera.position.set(player.x,player.y+1.25,player.z);camera.rotation.set(pitch,yaw,0,'YXZ');
robots.forEach(r=>{r.phase+=dt;const x=r.x+Math.sin(r.phase*.65)*1.8,z=r.z+Math.cos(r.phase*.7)*1.8;r.g.position.set(x,.05+Math.sin(r.phase*2)*.08,z);if(Math.hypot(x-player.x,z-player.z)<1.5&&player.y<3)health=Math.max(0,health-dt*8)});
for(let i=shots.length-1;i>=0;i--){const p=shots[i];p.o.position.addScaledVector(p.dir,27*dt);p.life-=dt;let hit=false;for(let j=robots.length-1;j>=0;j--){if(p.o.position.distanceTo(robots[j].g.position.clone().add(new THREE.Vector3(0,1,0)))<1.1){scene.remove(robots[j].g);robots.splice(j,1);score++;hit=true;say('ROBOT DISABLED!');break}}if(p.life<=0||hit){scene.remove(p.o);shots.splice(i,1)}}cool=Math.max(0,cool-dt);msgTime-=dt;if(msgTime<=0)document.getElementById('message').style.opacity=0;document.getElementById('health').textContent=Math.ceil(health);document.getElementById('score').textContent=score;let name='CENTRAL HUB',best=Math.hypot(player.x,player.z);for(const a of islands){const d=Math.hypot(player.x-a.x,player.z-a.z);if(d<best){best=d;name=a.name}}document.getElementById('island').textContent=name}
let last=performance.now();function loop(t){requestAnimationFrame(loop);const dt=Math.min((t-last)/1000,.035);last=t;update(dt);renderer.render(scene,camera)}requestAnimationFrame(loop);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});say('Welcome to the Chat Dimension! Find the islands and disable the robots.');
</script></body></html>
